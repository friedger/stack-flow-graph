name: Update transfer data

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch transfers from Secondlayer
        run: npm run data:update
        env:
          SECONDLAYER_API_KEY: ${{ secrets.SECONDLAYER_API_KEY }}
          HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}

      - run: npx vitest run

      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/transfers.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add src/data/transfers.json
          git commit -m "chore: update transfer data"
          git push
